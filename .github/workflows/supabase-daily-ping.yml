name: Supabase Daily Ping

on:
  workflow_dispatch:
  schedule:
    # Her gün Türkiye saatiyle yaklaşık 09:17'de çalışır (GitHub geciktirebilir).
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Supabase REST API ping
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl             --silent             --show-error             --location             --output /tmp/supabase-response.json             --write-out "%{http_code}"             --max-time 60             --retry 3             --retry-delay 5             --header "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueHFjdmpic3NpaXdkdXpmcXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTM0NTQsImV4cCI6MjA5ODI2OTQ1NH0.Iw_bY4yWSEXxCKDQCTmwvHwTd0nG_tg7pGg-V06mnzw"             --header "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueHFjdmpic3NpaXdkdXpmcXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTM0NTQsImV4cCI6MjA5ODI2OTQ1NH0.Iw_bY4yWSEXxCKDQCTmwvHwTd0nG_tg7pGg-V06mnzw"             --header "Accept: application/json"             "https://nnxqcvjbssiiwduzfqwv.supabase.co/rest/v1/activities?select=id&limit=1")

          echo "Supabase HTTP status: $HTTP_CODE"
          cat /tmp/supabase-response.json || true

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Supabase ping başarısız oldu."
            exit 1
          fi

          echo "Supabase ping başarılı."
